name: autofix.ci

on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read

jobs:
  autofix:
    name: Autofix Pull Request
    runs-on: ubuntu-latest
    if: github.base_ref == github.event.repository.default_branch

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # We need the full history for comparing branches
          ref: ${{ github.head_ref }}  # Check out the PR branch

      - name: Setup PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          cache: true

      - name: Install dependencies
        run: pdm install -d

      - name: Run linting
        run: pdm run lint

      - name: Run formatting
        run: pdm run format

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        if: always()
