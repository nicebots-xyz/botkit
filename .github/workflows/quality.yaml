name: Quality Checks

# Every check runs as a step of a single job: Actions bills each job rounded up to the minute,
# so one job with one dependency install costs far less than a job per check.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          cache: true

      - name: Install dependencies
        id: install
        run: pdm install -d

      - name: Format Check
        run: pdm run ruff format --check .

      - name: Lint Check
        if: ${{ !cancelled() && steps.install.outcome != 'failure' }}
        run: pdm run ruff check .

      - name: Tests Check
        if: ${{ !cancelled() && steps.install.outcome != 'failure' }}
        run: pdm run tests

      - name: Setup Licensor
        if: ${{ !cancelled() }}
        uses: nicebots-xyz/licensor/.github/actions/setup-licensor@a5893a8a480981ea21cb25cedcb0302616e8b859 # v0.1.2
        with:
          version: v0.1.1

      - name: License Header Check
        if: ${{ !cancelled() }}
        run: licensor check * --ignore ".*"
